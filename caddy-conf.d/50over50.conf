50over50.garywallage.uk {
    import cloudflare_tls
    import performance
    import security_headers

    # Authentik Outpost Callback (Ready for Google SSO Provider binding)
    handle /outpost.goauthentik.io/* {
        reverse_proxy authentik-server:9000 {
            header_up Host {host}
        }
    }

    # API Endpoints (Admin & Public) - strictly private & dynamic
    handle /api/* {
        header Cache-Control "no-store, no-cache, private, must-revalidate"
        header Pragma "no-cache"
        reverse_proxy gary-50-project_backend:8090 {
            import proxy_optimizations
        }
    }

    # Admin Portal - strictly private & dynamic
    handle /admin* {
        header Cache-Control "no-store, no-cache, private, must-revalidate"
        header Pragma "no-cache"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }

    # Client Delivery Galleries - private & dynamic
    handle /gallery/* {
        header Cache-Control "no-store, no-cache, private, must-revalidate"
        header Pragma "no-cache"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }

    # Content-Hashed Vite/Astro Assets (Immutable 1-Year Cache)
    handle /_astro/* {
        header Cache-Control "public, max-age=31536000, immutable"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }

    # Static Photographic Assets (24h cache with stale-while-revalidate to prevent stale photo retention - Issue #16)
    handle /images/* {
        header Cache-Control "public, max-age=86400, stale-while-revalidate=604800, must-revalidate"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }

    # Robots.txt (short cache to ensure instant crawler policy updates)
    handle /robots.txt {
        header Cache-Control "public, max-age=300, must-revalidate"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }

    # Public Editorial & Marketing Pages (Cloudflare Always-Online Edge Caching)
    handle {
        header Cache-Control "public, max-age=600, s-maxage=86400, stale-while-revalidate=604800, stale-if-error=86400"
        header X-Robots-Tag "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
        reverse_proxy gary-50-project_frontend:3000 {
            import proxy_optimizations
        }
    }
}
