# --- MEDIA STACK SERVICES ---
sonarr.wallage.org.uk, radarr.wallage.org.uk, prowlarr.wallage.org.uk,
lidarr.wallage.org.uk, whisparr.wallage.org.uk, bazarr.wallage.org.uk,
maintainerr.wallage.org.uk, pinchflat.wallage.org.uk {

    import cloudflare_tls
    import performance

    # STRICT AUTH ROUTE
    route {
        import authentik  # Must stay inside the route block

        @sonarr host sonarr.wallage.org.uk
        handle @sonarr {
            reverse_proxy media_sonarr:8989
        }

        @radarr host radarr.wallage.org.uk
        handle @radarr {
            reverse_proxy media_radarr:7878
        }

        @prowlarr host prowlarr.wallage.org.uk
        handle @prowlarr {
            reverse_proxy media_prowlarr:9696
        }

        @lidarr host lidarr.wallage.org.uk
        handle @lidarr {
            reverse_proxy media_lidarr:8686
        }

        @whisparr host whisparr.wallage.org.uk
        handle @whisparr {
            reverse_proxy media_whisparr:6969
        }

        @bazarr host bazarr.wallage.org.uk
        handle @bazarr {
            reverse_proxy media_bazarr:6767
        }

        @maintainerr host maintainerr.wallage.org.uk
        handle @maintainerr {
            reverse_proxy media_maintainerr:6246
        }

        @pinchflat host pinchflat.wallage.org.uk
        handle @pinchflat {
            # Corrected port from 8945 to 8080
            reverse_proxy media_pinchflat:8945
        }
    }
}

# --- STASH (Direct Access - No Authentik) ---
stash.wallage.org.uk {
    import cloudflare_tls
    import performance
    reverse_proxy media_stash:9999 {
        import proxy_optimizations
    }
}

# Seerr - Public Front End
seerr.wallage.org.uk, overseerr.wallage.org.uk {
    import cloudflare_tls
    import performance
    reverse_proxy media_seerr:5055
}
