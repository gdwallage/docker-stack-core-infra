# n8n - Automation
n8n.wallage.org.uk {
    import cloudflare_tls
    import performance
    reverse_proxy web_n8n:5678 {
        import proxy_optimizations
    }
}

# Nextcloud - Self-Managed Auth
nextcloud.wallage.org.uk {
    import cloudflare_tls
    import performance
    reverse_proxy web_nextcloud-app:80 {
        import proxy_optimizations
    }
    redir /.well-known/carddav /remote.php/dav 301
    redir /.well-known/caldav /remote.php/dav 301
    header Strict-Transport-Security "max-age=15552000;"
}

# SearXNG - Now Protected
search.wallage.org.uk {
    import cloudflare_tls
    import performance
    import authentik
    reverse_proxy web_searxng:8080 {
        import proxy_optimizations
    }
}

# Emby - Public (for client compatibility)
emby.wallage.org.uk {
    import cloudflare_tls
    import performance
    reverse_proxy web_emby:8096 {
        import proxy_optimizations
    }
}
