# --- AUTHENTIK DOMAIN-LEVEL SNIPPET ---
(authentik) {
    route {
        # 1. Always let the callback through first
        reverse_proxy /outpost.goauthentik.io/* http://authentik-server:9000 {
            header_up Host {host}
        }

        # 2. Forward authentication to the server
        forward_auth http://authentik-server:9000 {
            uri /outpost.goauthentik.io/auth/caddy
            header_up Host {host}
            # Combined headers for compatibility with both Modern and Legacy apps
            copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt Remote-User Remote-Groups Remote-Email Remote-Name
            trusted_proxies private_ranges
        }
    }
}

# --- CLOUDFLARE DNS CHALLENGE ---
(cloudflare_tls) {
    tls {
        dns cloudflare {env.CLOUDFLARE_API_TOKEN}
    }
}

# --- PERFORMANCE & PROXY ---
(performance) {
    encode zstd gzip
    @static {
        path *.ico *.css *.js *.gif *.jpg *.jpeg *.png *.svg *.woff *.woff2 *.webp *.avif *.ttf *.otf *.eot *.mp4 *.webm
    }
    header @static Cache-Control "public, max-age=31536000, must-revalidate"
}

(proxy_optimizations) {
    header_up Host {host}
    header_up X-Real-IP {remote_host}
    transport http {
        read_buffer 16384
        dial_timeout 30s
        response_header_timeout 5m
    }
}
